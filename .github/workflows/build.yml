name: Build DEWZX firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install core ESP32 dan library
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli lib install "Adafruit GFX Library" "Adafruit BusIO" "Adafruit ST7735 and ST7789 Library" "ArduinoJson"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,PartitionScheme=huge_app,CDCOnBoot=cdc \
            --export-binaries DEWZX_VOICE_AI

      - uses: actions/upload-artifact@v4
        with:
          name: dewzx-firmware
          path: DEWZX_VOICE_AI/build/**/*.bin
